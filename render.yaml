services:
  - type: web
    name: snapmedia
    env: docker
    plan: free
    dockerfilePath: Dockerfile
    envVars:
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production
      - key: PROVIDER_API_URL
        sync: false
      - key: PROVIDER_API_HOST
        sync: false
      - key: PROVIDER_API_KEY
        sync: false
